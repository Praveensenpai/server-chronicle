[package]
name = "server-chronicle"
version = "0.1.14"
edition = "2021"
authors = ["Praveensenpai <pvnt20@gmail.com>"]
description = "⏱️ Server activity logger, battery UPS monitor, Ratatui TUI, and AI context generator for Ubuntu Server"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
